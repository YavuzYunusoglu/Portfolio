<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project — Yavuz Yunusoğlu</title>
  <meta name="description" content="Project breakdown by Yavuz Yunusoğlu.">
  <meta name="theme-color" content="#f2841a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("yavuz-theme"); } catch (e) {}
      if (t !== "day" && t !== "night") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="project">
  <a class="skip" href="#main" data-t="skipLink"></a>

  <div class="ribbon" data-ribbon></div>
  <header class="site-header" data-header></header>

  <main id="main">
    <div class="wrap" data-project>
      <noscript><p class="crumbs">This page needs JavaScript to load the project. <a href="index.html">Back home</a></p></noscript>
    </div>
  </main>

  <div class="lightbox" hidden role="dialog" aria-modal="true" data-t-aria="project.viewer.label">
    <img alt="">
    <button class="lb-close" type="button" data-t-aria="project.viewer.close"></button>
    <button class="lb-prev" type="button" data-t-aria="project.viewer.prev"></button>
    <button class="lb-next" type="button" data-t-aria="project.viewer.next"></button>
    <span class="lb-count mono"></span>
  </div>

  <footer class="site-footer" data-footer></footer>

  <script src="data/profile.js"></script>
  <script src="data/content.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/events.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/site.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
