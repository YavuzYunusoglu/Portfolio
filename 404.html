<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost — Yavuz Yunusoğlu</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any missing path, from any depth.
       SITE_ROOT must match where the site lives: "/" for username.github.io,
       "/repo-name/" for a project site. -->
  <script>
    var SITE_ROOT = "/";
    document.write('<base href="' + SITE_ROOT + '">');
    (function () {
      var t;
      try { t = localStorage.getItem("yavuz-theme"); } catch (e) {}
      if (t !== "day" && t !== "night") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lost">
  <a class="skip" href="#main" data-t="skipLink"></a>

  <div class="ribbon" data-ribbon></div>
  <header class="site-header" data-header></header>
  <main id="main">
    <section class="lost wrap">
      <div>
        <div class="big" data-t="lost.big"></div>
        <h1 data-t="lost.title"></h1>
        <p data-t="lost.text"></p>
        <a class="btn btn-primary" href="index.html" data-t="lost.button"></a>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="data/profile.js"></script>
  <script src="data/content.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
